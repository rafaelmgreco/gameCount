services:
  mysql:
    image: mysql:8.4
    container_name: commander-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: commander_tracker
      MYSQL_USER: commander
      MYSQL_PASSWORD: commander
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql_data:
